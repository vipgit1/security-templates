name: snyk-scan

on:
  workflow_call:
    inputs:
      severity-threshold:
        description: "low | medium | high | critical"
        type: string
        default: high
      run-code-scan:
        description: "Run Snyk Code (SAST)"
        type: boolean
        default: true
      gate-on-pr:
        description: "Fail PR runs on any finding (not just new ones)"
        type: boolean
        default: false
    secrets:
      SNYK_TOKEN:
        required: true

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: write

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SEVERITY: ${{ inputs.severity-threshold }}

    steps:
      - uses: actions/checkout@v4

      - uses: snyk/actions/setup@master

      - name: Snyk Open Source
        id: oss
        run: |
          set +e
          snyk test --all-projects --sarif-file-output=snyk-oss.sarif
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Snyk Code
        id: code
        if: inputs.run-code-scan
        run: |
          set +e
          snyk code test --sarif-file-output=snyk-code.sarif
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Snyk Monitor (dashboard snapshot)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: snyk monitor --all-projects
        continue-on-error: true
        
      - name: Upload Snyk Open Source results
        if: always() && hashFiles('snyk-oss.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-open-source

      - name: Upload Snyk Code results
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Post PR summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const count = (file) => {
              if (!fs.existsSync(file)) return null;
              const results = JSON.parse(fs.readFileSync(file, 'utf8')).runs
                .flatMap(r => r.results || []);
              return {
                high: results.filter(r => r.level === 'error').length,
                medium: results.filter(r => r.level === 'warning').length,
                low: results.filter(r => r.level === 'note').length,
              };
            };
            const row = (name, c) => c
              ? `| ${name} | ${c.high} | ${c.medium} | ${c.low} |`
              : `| ${name} | n/a | n/a | n/a |`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Snyk security summary',
              '',
              '| Scan | High/Critical | Medium | Low |',
              '|---|---|---|---|',
              row('Open Source (dependencies)', count('snyk-oss.sarif')),
              row('Code (SAST)', count('snyk-code.sarif')),
              '',
              `Details: [workflow run](${runUrl}) and the **Security → Code scanning** tab.`,
              '<!-- snyk-summary -->',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- snyk-summary -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

      - name: Enforce security gate
        if: always() && (github.event_name != 'pull_request' || inputs.gate-on-pr)
        run: |
          fail=0
          for code in "${{ steps.oss.outputs.exit }}" "${{ steps.code.outputs.exit }}"; do
            if [ -n "$code" ] && [ "$code" -gt 1 ]; then
              echo "::error::A scan could not complete (exit code $code)"; fail=1
            fi
          done
          case "$SEVERITY" in
            critical|high) levels='"error"' ;;
            medium)        levels='"error","warning"' ;;
            *)             levels='"error","warning","note"' ;;
          esac
          for f in snyk-oss.sarif snyk-code.sarif; do
            [ -f "$f" ] || continue
            n=$(jq "[.runs[].results[]? | select(.level | IN($levels))] | length" "$f")
            echo "$f: $n finding(s) at or above $SEVERITY"
            [ "$n" -gt 0 ] && fail=1
          done
          exit $fail
